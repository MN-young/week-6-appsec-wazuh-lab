name: SecureOps Semgrep Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SecureOps source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep and export JSON findings
        run: semgrep scan --config auto --json --output semgrep-results.json .

      - name: Upload Semgrep findings
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-security-findings
          path: semgrep-results.json

      - name: Enforce Semgrep security gate
        run: semgrep scan --config auto --error .

  dependency-scan:
    name: pip-audit Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SecureOps source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies and export JSON
        run: pip-audit -r requirements.txt --format json --output pip-audit-results.json

      - name: Upload pip-audit findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-security-findings
          path: pip-audit-results.json
